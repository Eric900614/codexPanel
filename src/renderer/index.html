<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Codex 码表</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main class="shell">
      <section class="topbar" aria-label="Codex usage status">
        <div>
          <p class="eyebrow">LOCAL CODEX METER</p>
          <h1>Codex 码表</h1>
        </div>
        <div class="top-actions">
          <span id="liveStatus" class="status-pill">读取中</span>
          <button id="refreshButton" class="ghost-button" type="button">刷新</button>
          <button id="costSettingsButton" class="ghost-button" type="button">成本设置</button>
          <button id="openFolderButton" class="ghost-button" type="button">打开目录</button>
        </div>
      </section>

      <section id="syncProgress" class="sync-progress" aria-live="polite">
        <div class="sync-progress-head">
          <span id="syncProgressMessage">同步中</span>
          <span id="syncProgressCount"></span>
        </div>
        <div class="sync-progress-track">
          <div id="syncProgressBar" class="sync-progress-bar" style="width: 12%"></div>
        </div>
      </section>

      <section id="app" class="dashboard" aria-live="polite">
        <div class="skeleton hero-skeleton"></div>
        <div class="skeleton-grid">
          <div class="skeleton"></div>
          <div class="skeleton"></div>
          <div class="skeleton"></div>
        </div>
      </section>
    </main>

    <section id="costSettingsOverlay" class="modal-backdrop" hidden>
      <form id="costSettingsForm" class="settings-modal">
        <div class="modal-header">
          <h2>成本设置</h2>
          <button id="closeCostSettingsButton" class="icon-button" type="button" aria-label="关闭">×</button>
        </div>
        <div id="costPackageList" class="package-list" aria-label="成本套餐列表"></div>
        <input id="costPackageId" type="hidden">
        <label class="field-row">
          <span>套餐名称</span>
          <input id="costPackageName" type="text" autocomplete="off" placeholder="5x">
        </label>
        <label class="field-row">
          <span>套餐金额</span>
          <input id="costPackageAmount" type="number" min="0" step="1" inputmode="decimal" placeholder="780">
        </label>
        <label class="field-row">
          <span>币种</span>
          <input id="costPackageCurrency" type="text" autocomplete="off" maxlength="8" placeholder="CNY">
        </label>
        <section class="cycle-settings" aria-label="成本周期">
          <div class="cycle-mode">
            <label>
              <input id="costCycleModeCustom" type="radio" name="costCycleMode" value="custom">
              <span>自定义周期</span>
            </label>
            <label>
              <input id="costCycleModeNaturalMonth" type="radio" name="costCycleMode" value="naturalMonth">
              <span>自然月</span>
            </label>
          </div>
          <div class="cycle-date-grid">
            <label class="field-row">
              <span>开始日期</span>
              <input id="costCycleStartDate" type="date">
            </label>
            <label class="field-row">
              <span>结束日期</span>
              <input id="costCycleEndDate" type="date">
            </label>
          </div>
          <p id="costCycleSummary" class="cycle-summary"></p>
        </section>
        <p id="costSettingsMessage" class="form-message"></p>
        <div class="modal-actions">
          <button id="newCostPackageButton" class="ghost-button" type="button">新建</button>
          <button id="clearCostSettingsButton" class="ghost-button" type="button">清空</button>
          <button class="ghost-button primary-button" type="submit">保存套餐</button>
        </div>
      </form>
    </section>

    <script src="./renderer.js"></script>
  </body>
</html>
